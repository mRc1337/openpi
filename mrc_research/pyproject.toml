[project]
name = "cask-openpi"
version = "0.1.0"
description = "Contact-aware shared skills layered on Physical Intelligence OpenPI"
readme = "pi_series_implementation_log.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "openpi",
]

[dependency-groups]
dev = [
    "pytest>=8.3.4",
    "ruff>=0.8.6",
]

[tool.uv.sources]
openpi = { path = "../openpi", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cask"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I", "N", "PT", "RUF", "UP"]
